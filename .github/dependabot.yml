version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-development:
        dependency-type: development
      python-runtime:
        dependency-type: production
  - package-ecosystem: npm
    directory: /apps/owner-console
    schedule:
      interval: weekly
    groups:
      owner-console:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /workers/publication
    schedule:
      interval: weekly
    groups:
      publication-worker:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
